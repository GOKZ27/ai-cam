# Virtual host AI Cam (tanpa port). Contoh untuk Apache di Laragon / XAMPP.
#
# Laragon:
#   1. Salin file ini ke  C:\laragon\etc\apache2\sites-enabled\
#      (JANGAN beri awalan "auto." agar Laragon tidak menimpanya)
#   2. Sesuaikan ROOT ke folder "public" project ini.
#   3. Reload Laragon.
# XAMPP:
#   1. Aktifkan: C:\xampp\apache\conf\httpd.conf -> hapus "#" pada
#      "Include conf/extra/httpd-vhosts.conf".
#   2. Salin blok <VirtualHost> di bawah ke
#      C:\xampp\apache\conf\extra\httpd-vhosts.conf lalu sesuaikan DocumentRoot.
#   3. Restart Apache.
#
# WAJIB di kedua cara: tambahkan baris berikut ke
#   C:\Windows\System32\drivers\etc\hosts   (Notepad dijalankan sebagai Administrator)
#   127.0.0.1 ai-cam.test
#
# Buka: http://ai-cam.test/ai-cam

define ROOT "C:/laragon/www/Aicam/ai-cam/public"
define SITE "ai-cam.test"

<VirtualHost *:80>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
